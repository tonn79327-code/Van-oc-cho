<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft Web Clone</title>
    <!-- Thư viện Three.js để dựng hình 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
        }

        /* Chữ "văn óc chó" màu đen hiển thị khi nhìn xuống chân */
        #footer-text {
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: black;
            font-family: monospace;
            font-weight: bold;
            font-size: 28px;
            display: none;
            z-index: 1000;
            text-shadow: 1px 1px 2px white;
            user-select: none;
        }

        /* Khung chứa các nút điều khiển ảo */
        #virtual-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .control-btn {
            width: 55px;
            height: 55px;
            background-color: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            cursor: pointer;
        }

        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>

    <!-- Dòng chữ hiện ra khi nhìn xuống chân -->
    <div id="footer-text">văn óc chó</div>

    <!-- Nút điều khiển ảo trên màn hình -->
    <div id="virtual-controls">
        <div class="control-row">
            <button id="btn-up" class="control-btn">⬆️</button>
        </div>
        <div class="control-row">
            <button id="btn-left" class="control-btn">⬅️</button>
            <button id="btn-down" class="control-btn">⬇️</button>
            <button id="btn-right" class="control-btn">➡️</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        init();
        animate();

        function init() {
            // 1. Khởi tạo không gian 3D
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Màu trời Minecraft

            // 2. Khởi tạo Camera góc nhìn thứ nhất
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 2;

            // 3. Khởi tạo Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 4. Thêm ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // 5. Tạo các khối block sàn cỏ
            const blockSize = 2;
            const geometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
            const material = new THREE.MeshLambertMaterial({ color: 0x557a2b });

            for (let x = -10; x <= 10; x += blockSize) {
                for (let z = -10; z <= 10; z += blockSize) {
                    const cube = new THREE.Mesh(geometry, material);
                    cube.position.set(x, -1, z);
                    scene.add(cube);
                }
            }

            // 6. Gán sự kiện nút bấm ảo
            setupVirtualControls();

            // 7. Xử lý cảm ứng vuốt màn hình để xoay góc nhìn
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            window.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;

                // Giới hạn góc nhìn tránh lật camera
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointerup', () => {
                isDragging = false;
            });

            window.addEventListener('resize', onWindowResize);
        }

        function setupVirtualControls() {
            const bindButton = (id, property, value) => {
                const btn = document.getElementById(id);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); window[property] = value; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); window[property] = false; });
                btn.addEventListener('mousedown', () => { window[property] = value; });
                btn.addEventListener('mouseup', () => { window[property] = false; });
            };

            bindButton('btn-up', 'moveForward', true);
            bindButton('btn-down', 'moveBackward', true);
            bindButton('btn-left', 'moveLeft', true);
            bindButton('btn-right', 'moveRight', true);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            velocity.x -= velocity.x * 10.0 * 0.016;
            velocity.z -= velocity.z * 10.0 * 0.016;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 20.0 * 0.016;
            if (moveLeft || moveRight) velocity.x -= direction.x * 20.0 * 0.016;

            camera.translateX(-velocity.x * 0.016);
            camera.translateZ(velocity.z * 0.016);

            // Kiểm tra góc nhìn cúi xuống chân để hiện chữ "văn óc chó" màu đen
            const footerText = document.getElementById('footer-text');
            if (camera.rotation.x < -0.8) {
                footerText.style.display = 'block';
            } else {
                footerText.style.display = 'none';
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
